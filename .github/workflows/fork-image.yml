name: Fork image

# Builds fork/Dockerfile and publishes it to GitHub Container Registry as
#   ghcr.io/<owner>/sonarr-fork:<sonarr version>
#   ghcr.io/<owner>/sonarr-fork:<sonarr version>-<short sha>
#   ghcr.io/<owner>/sonarr-fork:latest
#
# The Sonarr version is read from the newest upstream tag reachable from the
# commit (git describe), and the .NET SDK version from global.json, so a
# tag-to-tag rebase needs no edits here. The test stage must pass before
# anything is pushed. See fork/README.md.

on:
  push:
    branches:
      - feature/always-show-custom-formats
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so git describe can find the upstream tag we sit on
          fetch-depth: 0

      - name: Work out versions
        id: versions
        run: |
          sonarr_version="$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')"
          sdk_version="$(jq -r .sdk.version global.json)"
          echo "sonarr=${sonarr_version}" >> "$GITHUB_OUTPUT"
          echo "sdk=${sdk_version}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sonarr-fork" >> "$GITHUB_OUTPUT"
          echo "Sonarr ${sonarr_version}, SDK ${sdk_version}, fork ${GITHUB_SHA::9}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests (test stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fork/Dockerfile
          target: test
          push: false
          build-args: |
            SONARR_VERSION=${{ steps.versions.outputs.sonarr }}
            DOTNET_SDK_VERSION=${{ steps.versions.outputs.sdk }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fork/Dockerfile
          push: true
          build-args: |
            SONARR_VERSION=${{ steps.versions.outputs.sonarr }}
            DOTNET_SDK_VERSION=${{ steps.versions.outputs.sdk }}
            BASE_IMAGE=ghcr.io/linuxserver/sonarr:version-${{ steps.versions.outputs.sonarr }}
            FORK_VERSION=${{ steps.versions.outputs.sha }}
          tags: |
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.sonarr }}
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.sonarr }}-${{ steps.versions.outputs.sha }}
            ${{ steps.versions.outputs.image }}:latest
          cache-from: type=gha
